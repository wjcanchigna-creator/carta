<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Special Letter For You ❤️</title>
    <!-- Canvas Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }

        /* Envelope Styles */
        .envelope-wrapper {
            cursor: pointer;
            text-align: center;
            animation: bounce 2s infinite;
        }

        .envelope {
            width: 280px;
            height: 180px;
            background: #e63946;
            border-radius: 10px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 15px 30px rgba(0,0,0,0.2);
        }

        .envelope::before {
            content: '';
            position: absolute;
            top: 0;
            border-left: 140px solid transparent;
            border-right: 140px solid transparent;
            border-top: 100px solid #d62828;
        }

        .envelope-heart {
            font-size: 50px;
            z-index: 2;
        }

        .envelope-text {
            margin-top: 20px;
            color: #d62828;
            font-weight: bold;
            font-size: 18px;
        }

        /* Card Styles */
        .card {
            background: white;
            padding: 30px 25px;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
            text-align: center;
            max-width: 420px;
            width: 100%;
            display: none;
            animation: fadeIn 0.8s ease-in-out;
            position: relative;
        }

        .heart-icon {
            font-size: 45px;
            animation: pulse 1.5s infinite;
            margin-bottom: 10px;
        }

        h1 {
            color: #e63946;
            font-size: 22px;
            margin-bottom: 12px;
        }

        p {
            color: #555;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 15px;
        }

        /* Timer Styles */
        .timer-box {
            background: #fff0f3;
            border: 2px dashed #ffb3c1;
            padding: 12px;
            border-radius: 15px;
            margin: 15px 0;
        }

        .timer-title {
            font-size: 13px;
            color: #ff4d6d;
            font-weight: bold;
            text-transform: uppercase;
        }

        .timer {
            font-size: 16px;
            font-weight: bold;
            color: #c9184a;
            margin-top: 5px;
        }

        /* Progress indicator */
        .page-indicator {
            font-size: 12px;
            color: #aaa;
            margin-bottom: 10px;
            font-weight: 600;
        }

        /* Buttons */
        .btn-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
            position: relative;
            min-height: 50px;
        }

        button {
            background-color: #e63946;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
        }

        button:hover {
            transform: scale(1.05);
            background-color: #d62828;
        }

        #btn-no {
            background-color: #6c757d;
            position: relative;
        }

        .hidden {
            display: none !important;
        }

        .final-message {
            font-size: 20px;
            font-weight: bold;
            color: #e63946;
            margin-top: 20px;
            animation: fadeIn 0.8s;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- Audio Player conectado a tu archivo MP3 -->
    <audio id="bg-music" loop preload="auto">
        <source src="cancion.mp3" type="audio/mpeg">
    </audio>

    <!-- Sobre Inicial -->
    <div class="envelope-wrapper" id="envelope-wrapper" onclick="openEnvelope()">
        <div class="envelope">
            <div class="envelope-heart">💌</div>
        </div>
        <div class="envelope-text">Tap to open your letter ✨</div>
    </div>

    <!-- Carta Principal -->
    <div class="card" id="card">
        <div class="page-indicator" id="page-indicator">Page 1 of 10</div>
        <div class="heart-icon" id="card-icon">💖</div>
        <h1 id="title">Loading...</h1>
        <p id="message">Loading...</p>

        <!-- Contador de tiempo -->
        <div class="timer-box" id="timer-box">
            <div class="timer-title">Time spent loving you</div>
            <div class="timer" id="timer">Calculating...</div>
        </div>

        <button id="btn-next" onclick="nextStep()">Next ➡️</button>

        <!-- Pregunta Final -->
        <div id="final-section" class="hidden">
            <div class="btn-container">
                <button id="btn-yes" onclick="acceptProposal()">YES! 🥰</button>
                <button id="btn-no" onmouseover="moveButton()" onclick="moveButton()">No 😜</button>
            </div>
        </div>

        <div id="final-text" class="final-message hidden"></div>
    </div>

    <script>
        // CAMBIA AQUÍ LA FECHA EN QUE EMPEZARON A SALIR: (Año, Mes-1, Día)
        const startDate = new Date(2023, 0, 1); 

        // Pestañas / Páginas con los nuevos mensajes
        const steps = [
            {
                icon: "💖",
                title: "You once told me...",
                message: "You had never received a love letter before. So I decided that your very first one couldn't be written on ordinary paper... It had to be built line by line, just for you. ✨"
            },
            {
                icon: "☁️",
                title: "Living in the Cloud",
                message: "Paper fades, gets lost, or crumples over time... But this code lives online forever. Exactly like my love and admiration for you."
            },
            {
                icon: "☀️",
                title: "My Sunshine",
                message: "They say the sun lights up the day, but I discovered that some people can do it even from afar. You became that little sun in my difficult days, and I want to keep walking with you—not just as someone who makes me smile, but as someone I want to cherish."
            },
            {
                icon: "🌍",
                title: "Destiny",
                message: "We come from different places, with different schedules and lives, but somehow we found a space where our laughter, stories, and dreams fit. I love thinking it wasn't just coincidence that brought us together."
            },
            {
                icon: "📖",
                title: "Written in My Life",
                message: "You told me you had never received a letter, but without noticing, you wrote many pages in my life: our talks, our jokes, your dreams, and every moment we share. I hope one day we look back and say: it was all worth it."
            },
            {
                icon: "🌷",
                title: "Thank You For Everything",
                message: "Thank you for every single laugh, for your sweet heart, for listening to me, and for being my absolute favorite person in the whole world."
            },
            {
                icon: "⏳",
                title: "Every Second Counts",
                message: "Look at the timer above... Every second spent knowing you has been worth it. And honestly? I want to keep counting time by your side for a very long time."
            },
            {
                icon: "🔐",
                title: "A Little Secret",
                message: "No matter how busy life gets or where we are, you will always be my safe place and my favorite notification on my phone."
            },
            {
                icon: "✨",
                title: "A New Chapter",
                message: "Out of 8 billion people, I'm so glad I found you. I want to keep building a million more memories together."
            },
            {
                icon: "💍",
                title: "I Have One Question...",
                message: "Since we're creating new memories every day... Will you officially be my girlfriend, my Naygelita? ❤️"
            }
        ];

        let currentStep = 0;

        function openEnvelope() {
            document.getElementById('envelope-wrapper').style.display = 'none';
            document.getElementById('card').style.display = 'block';
            
            // Reproducir música subida
            const music = document.getElementById('bg-music');
            music.play().catch(e => console.log("Audio waiting for interaction", e));

            renderStep();
            startTimer();
        }

        function renderStep() {
            const step = steps[currentStep];
            document.getElementById('page-indicator').innerText = `Page ${currentStep + 1} of ${steps.length}`;
            document.getElementById('card-icon').innerText = step.icon;
            document.getElementById('title').innerText = step.title;
            document.getElementById('message').innerText = step.message;
        }

        function nextStep() {
            if (currentStep < steps.length - 1) {
                currentStep++;
                renderStep();

                if (currentStep === steps.length - 1) {
                    document.getElementById('btn-next').classList.add('hidden');
                    document.getElementById('final-section').classList.remove('hidden');
                }
            }
        }

        // Mover el botón NO cuando intenten tocarlo
        function moveButton() {
            const btnNo = document.getElementById('btn-no');
            const x = Math.random() * (window.innerWidth - 120) - (window.innerWidth / 2 - 60);
            const y = Math.random() * (window.innerHeight - 120) - (window.innerHeight / 2 - 60);
            
            btnNo.style.position = 'fixed';
            btnNo.style.left = Math.max(20, Math.min(window.innerWidth - 100, Math.abs(x))) + 'px';
            btnNo.style.top = Math.max(20, Math.min(window.innerHeight - 50, Math.abs(y))) + 'px';
        }

        function acceptProposal() {
            document.getElementById('final-section').classList.add('hidden');
            const finalText = document.getElementById('final-text');
            finalText.innerText = "I knew you'd say YES! I love you so much, Naygelita! ❤️🎉🥰";
            finalText.classList.remove('hidden');

            // Lluvia de confeti
            confetti({
                particleCount: 150,
                spread: 80,
                origin: { y: 0.6 }
            });
        }

        function startTimer() {
            setInterval(() => {
                const now = new Date();
                const diff = now - startDate;

                const days = Math.floor(diff / (1000 * 60 * 60 * 24));
                const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
                const minutes = Math.floor((diff / 1000 / 60) % 60);
                const seconds = Math.floor((diff / 1000) % 60);

                document.getElementById('timer').innerText = 
                    `${days}d ${hours}h ${minutes}m ${seconds}s`;
            }, 1000);
        }
    </script>
</body>
</html>
